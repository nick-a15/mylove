<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Special Date Invitation</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 28px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    .emoji {
      font-size: 76px;
      margin-bottom: 8px;
      animation: heartbeat 1.4s infinite;
    }

    h1 {
      font-size: clamp(26px, 4vw, 42px);
      margin: 16px 0 22px;
      color: #111827;
      line-height: 1.2;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }

    #yesBtn:hover {
      background: var(--yesHover);
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .date-options {
      display: none;
      margin-top: 20px;
      animation: pop .35s ease;
    }

    .date-options h2 {
      font-size: clamp(24px, 4vw, 36px);
      margin-bottom: 20px;
      color: #111827;
    }

    .date-btn {
      position: static;
      transform: none;
      display: block;
      width: min(430px, 100%);
      margin: 14px auto;
      background: var(--yes);
      color: white;
    }

    .date-btn:hover {
      background: var(--yesHover);
      transform: scale(1.03);
    }

    .result {
      display: none;
      margin-top: 20px;
      animation: pop .35s ease;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .result p {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
    }

    .celebration-gif {
      width: min(300px, 90vw);
      margin: 12px auto 18px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }

    .send-note {
      font-size: 14px !important;
      font-weight: 500 !important;
      opacity: .75;
      margin-top: 10px;
    }

    @keyframes pop {
      from {
        transform: scale(.96);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
    <div class="emoji">💖</div>

    <h1 id="mainQuestion">
      Ohema, will you be free to spend 3 days with me?
    </h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">Choose carefully 😭</div>

    <section class="date-options" id="dateOptions">
      <h2>Which date works best for you? 🥰</h2>

      <button class="date-btn" onclick="chooseDate('14/06/2026 to 17/06/2026')">
        14/06/2026 to 17/06/2026
      </button>

      <button class="date-btn" onclick="chooseDate('15/06/2026 to 18/06/2026')">
        15/06/2026 to 18/06/2026
      </button>
    </section>

    <section class="result" id="result">
      <h2>YAY! 🎉❤️</h2>

      <img 
        class="celebration-gif"
        src="https://i0.wp.com/justmaths.co.uk/wp-content/uploads/2016/10/celebration-gif.gif?fit=300%2C136&ssl=1"
        alt="Celebration GIF"
      />

      <p id="chosenDate"></p>
      <p>
        I honestly cannot wait to spend these 3 days with you.
        I promise to make it special 🥰
      </p>
      <p class="send-note" id="sendNote"></p>
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const hint = document.getElementById("hint");
    const mainQuestion = document.getElementById("mainQuestion");
    const dateOptions = document.getElementById("dateOptions");
    const result = document.getElementById("result");
    const chosenDate = document.getElementById("chosenDate");
    const sendNote = document.getElementById("sendNote");

    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      confettiCanvas.width = Math.floor(window.innerWidth * dpr);
      confettiCanvas.height = Math.floor(window.innerHeight * dpr);
      confettiCanvas.style.width = "100vw";
      confettiCanvas.style.height = "100vh";
    }

    resizeConfettiCanvas();
    window.addEventListener("resize", resizeConfettiCanvas);
    window.addEventListener("orientationchange", () => {
      setTimeout(resizeConfettiCanvas, 150);
    });

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function fullScreenConfetti() {
      const end = Date.now() + 1600;

      (function frame() {
        confettiInstance({
          particleCount: 12,
          spread: 90,
          startVelocity: 45,
          ticks: 180,
          origin: {
            x: Math.random(),
            y: Math.random() * 0.3
          }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();

      setTimeout(() => {
        confettiInstance({
          particleCount: 300,
          spread: 140,
          startVelocity: 60,
          ticks: 220,
          origin: {
            x: 0.5,
            y: 0.55
          }
        });
      }, 300);
    }

    let yesScale = 1;

    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(px, py) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - px;
      let dy = (b.top + b.height / 2) - py;
      let mag = Math.hypot(dx, dy) || 1;

      dx /= mag;
      dy /= mag;

      let newLeft = (b.left - z.left) + dx * 150;
      let newTop = (b.top - z.top) + dy * 150;

      newLeft = clamp(newLeft, 0, z.width - b.width);
      newTop = clamp(newTop, 0, z.height - b.height);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();

      const d = Math.hypot(
        (b.left + b.width / 2) - e.clientX,
        (b.top + b.height / 2) - e.clientY
      );

      if (d < 140) {
        moveNo(e.clientX, e.clientY);
      }
    });

    noBtn.addEventListener("click", e => {
      e.preventDefault();
      growYes();
    });

    yesBtn.addEventListener("click", () => {
      zone.style.display = "none";
      hint.style.display = "none";
      mainQuestion.style.display = "none";
      dateOptions.style.display = "block";
      resizeConfettiCanvas();
      fullScreenConfetti();
    });

    function chooseDate(date) {
      dateOptions.style.display = "none";
      result.style.display = "block";
      chosenDate.textContent = `You chose: ${date}`;

      resizeConfettiCanvas();
      fullScreenConfetti();

      /*
        IMPORTANT:
        Replace this with your WhatsApp number in international format.
        Example: if your UK number is 07123456789, write 447123456789.
      */
      const phoneNumber = "447XXXXXXXXX";

      const message = `Hey, I picked this date: ${date} ❤️`;

      if (phoneNumber !== "447XXXXXXXXX") {
        sendNote.textContent = "Opening WhatsApp so you can send me your chosen date...";
        setTimeout(() => {
          window.location.href = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
        }, 2500);
      } else {
        sendNote.textContent = "Please screenshot this and send it to me so I know which date you picked ❤️";
      }
    }
  </script>
</body>
</html>
