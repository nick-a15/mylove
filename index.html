      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.05);
      backdrop-filter: blur(0px);
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 10;
      width: min(500px, 94vw);
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      backdrop-filter: none;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }
    .globe { font-size: 64px; display: block; margin-bottom: 16px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(24px, 4vw, 36px);
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .sub { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 32px; }
    .cities { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .city-btn {
      padding: 22px 12px 18px;
      border-radius: 16px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.12);
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .city-btn .icon { font-size: 30px; }
    .city-btn:hover {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-3px);
    }
    .result { display: none; }
    .result .big { font-size: 64px; display: block; margin-bottom: 12px; }
    .result h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 5vw, 42px);
      color: #ffffff;
      margin-bottom: 12px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .result p { font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.9); }
    .result .note { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div id="mainView">
      <span class="globe">🌍</span>
      <h1>Where should we go?</h1>
      <p class="sub">Pick a city for our 3-day trip 🗺️</p>
      <div class="cities">
        <button class="city-btn" onclick="pick('London')">
          <span class="icon">🎡</span> London
        </button>
        <button class="city-btn" onclick="pick('Manchester')">
          <span class="icon">🌧️</span> Manchester
        </button>
        <button class="city-btn" onclick="pick('Liverpool')">
          <span class="icon">🎸</span> Liverpool
        </button>
        <button class="city-btn" onclick="pick('Nottingham')">
          <span class="icon">🏹</span> Nottingham
        </button>
      </div>
    </div>
    <div class="result" id="resultView">
      <span class="big">🎉</span>
      <h2>We're going to London!</h2>
      <p>I cannot wait to spend 3 amazing days with you in the city 🥰</p>
      <p class="note">WhatsApp is opening so you can confirm ❤️</p>
    </div>
  </div>
  <script>
    function pick(city) {
      document.getElementById('mainView').style.display = 'none';
      document.getElementById('resultView').style.display = 'block';
      confetti({ particleCount: 200, spread: 130, origin: { y: 0.6 } });
      const msg = "I picked " + city + " for our 3 days together! ❤️";
      setTimeout(() => {
        window.location.href = "https://wa.me/447471068610?text=" + encodeURIComponent(msg);
      }, 3000);
    }
  </script>
</body>
</html>
