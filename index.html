<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Special Date Invitation</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #f3e8ff, #d8b4fe);
      font-family: Arial, sans-serif;
      padding: 16px;
      overflow: hidden;
    }

    /* Floating emojis */
    .floater {
      position: fixed;
      font-size: 28px;
      animation: floatUp linear infinite;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .card {
      width: min(720px, 92vw);
      background: rgba(255, 255, 255, 0.85);
      padding: 30px 22px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.15);
    }

    .emoji {
      font-size: 76px;
      animation: heartbeat 1.4s infinite;
    }

    h1 {
      font-size: clamp(26px, 4vw, 42px);
      color: #111827;
      margin: 18px 0 24px;
      line-height: 1.2;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
    }

    button {
      padding: 16px 26px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
      transition: 0.2s ease;
    }

    #yesBtn,
    #noBtn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    #yesBtn {
      left: 18%;
      background: #ff3b7a;
      color: white;
    }

    #yesBtn:hover {
      background: #ff1f68;
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.7;
    }

    .date-options {
      display: none;
      margin-top: 20px;
    }

    .date-options h2 {
      font-size: clamp(24px, 4vw, 36px);
      color: #111827;
      margin-bottom: 20px;
    }

    .date-btn {
      display: block;
      width: min(440px, 100%);
      margin: 14px auto;
      background: #ff3b7a;
      color: white;
    }

    .date-btn:hover {
      background: #ff1f68;
      transform: scale(1.03);
    }

    .result {
      display: none;
      margin-top: 20px;
    }

    .result h2 {
      font-size: clamp(30px, 4.5vw, 46px);
      margin: 10px 0;
    }

    .result p {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
      line-height: 1.4;
    }

    .celebration-gif {
      width: min(300px, 90vw);
      margin: 12px auto 18px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="emoji">💖</div>

    <h1 id="mainQuestion">
      Ohema, will you be free to spend 3 days with me?
    </h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">Choose carefully 😭</div>

    <section class="date-options" id="dateOptions">
      <h2>Which date works best for you? 🥰</h2>

      <button class="date-btn" onclick="chooseDate('14/06/2026 to 17/06/2026')">
        14/06/2026 to 17/06/2026
      </button>

      <button class="date-btn" onclick="chooseDate('15/06/2026 to 18/06/2026')">
        15/06/2026 to 18/06/2026
      </button>
    </section>

    <section class="result" id="result">
      <h2>YAY! 🎉❤️</h2>

      <img
        class="celebration-gif"
        src="https://i0.wp.com/justmaths.co.uk/wp-content/uploads/2016/10/celebration-gif.gif?fit=300%2C136&ssl=1"
        alt="Celebration GIF"
      />

      <p id="chosenDate"></p>

      <p>
        I honestly cannot wait to spend these 3 days with you.
        I promise to make it special 🥰
      </p>

      <p style="font-size: 15px; opacity: 0.7;">
        WhatsApp will open so you can send me your chosen date ❤️
      </p>
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const hint = document.getElementById("hint");
    const mainQuestion = document.getElementById("mainQuestion");
    const dateOptions = document.getElementById("dateOptions");
    const result = document.getElementById("result");
    const chosenDate = document.getElementById("chosenDate");

    let yesScale = 1;

    function growYes() {
      yesScale = Math.min(2.2, yesScale + 0.1);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function moveNoButton() {
      const zoneRect = zone.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      const maxLeft = zoneRect.width - noRect.width;
      const maxTop = zoneRect.height - noRect.height;

      const randomLeft = Math.random() * maxLeft;
      const randomTop = Math.random() * maxTop;

      noBtn.style.left = randomLeft + "px";
      noBtn.style.top = randomTop + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    noBtn.addEventListener("mouseover", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);
    noBtn.addEventListener("touchstart", function(event) {
      event.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", function() {
      zone.style.display = "none";
      hint.style.display = "none";
      mainQuestion.style.display = "none";
      dateOptions.style.display = "block";

      confetti({
        particleCount: 180,
        spread: 120,
        origin: { y: 0.6 }
      });
    });

    function chooseDate(date) {
      dateOptions.style.display = "none";
      result.style.display = "block";
      chosenDate.textContent = "You chose: " + date;

      confetti({
        particleCount: 250,
        spread: 140,
        origin: { y: 0.6 }
      });

      const message = "Hey, I picked this date: " + date + " ❤️";

      /*
        IMPORTANT:
        Replace this number with your real WhatsApp number.
        Example:
        If your number is 07123456789,
        write it as 447123456789.
      */
      const phoneNumber = "447471068610";

      setTimeout(function() {
        window.location.href =
          "https://wa.me/" + phoneNumber + "?text=" + encodeURIComponent(message);
      }, 2500);
    }
  </script>

  <script>
    const emojis = ['💖', '💕', '💗', '💓', '✨', '🌸', '💝', '💞', '🫶', '🌷', '💫', '🩷'];

    function createFloater() {
      const el = document.createElement('span');
      el.classList.add('floater');
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (18 + Math.random() * 26) + 'px';
      const duration = 6 + Math.random() * 8;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (Math.random() * -duration) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), (duration + 2) * 2000);
    }

    for (let i = 0; i < 20; i++) createFloater();
    setInterval(createFloater, 800);
  </script>
</body>
</html>
